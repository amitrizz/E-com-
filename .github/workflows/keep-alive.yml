name: Keep Alive

on:
  schedule:
    # Runs every 8 minutes to keep the Render server warm and prevent cold starts / sleep
    - cron: "*/8 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Target health check URL (optional)"
        required: false
        default: ""

jobs:
  keep-alive:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          # If manual input provided, ping that. Otherwise ping both primary domain and direct Render host.
          if [ -n "${{ github.event.inputs.url }}" ]; then
            URLS=("${{ github.event.inputs.url }}")
          else
            URLS=(
              "https://kashustore.in/api/health"
              "https://e-com-nlzo.onrender.com/api/health"
            )
          fi

          for TARGET_URL in "${URLS[@]}"; do
            TARGET_URL="${TARGET_URL%/}"
            if [[ "$TARGET_URL" != *"/api/health"* && "$TARGET_URL" != *"/health"* ]]; then
              TARGET_URL="$TARGET_URL/api/health"
            fi

            echo "=========================================="
            echo "Pinging: $TARGET_URL"
            RESPONSE=$(curl -s -S -w "\n%{http_code}" --max-time 30 "$TARGET_URL")
            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

            echo "HTTP Status Code: $HTTP_CODE"
            echo "Response Body: $HTTP_BODY"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "Status: SUCCESS"
            else
              echo "Status: FAILED ($HTTP_CODE)"
              exit 1
            fi
          done

          echo "All health endpoints are active and healthy!"
